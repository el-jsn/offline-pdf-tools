<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><meta name="color-scheme" content="light dark"><title>Merge PDFs</title></head>
<body><div class="workspace" id="workspace">
<aside id="sidebar" aria-label="PDF tools"><div class="app-name"><span data-icon="document"></span>PDF Tools</div>
<nav aria-label="Choose a tool"><button class="tool active" data-mode="merge" aria-pressed="true"><span data-icon="merge"></span>Merge PDFs</button><button class="tool" data-mode="compress" aria-pressed="false"><span data-icon="compress"></span>Compress PDF</button><button class="tool" data-mode="split" aria-pressed="false"><span data-icon="split"></span>Split PDF</button><button class="tool" data-mode="organize" aria-pressed="false"><span data-icon="organize"></span>Organize pages</button></nav>
<div class="sidebar-bottom"><div class="appearance-control"><label for="appearance">Appearance</label><select id="appearance"><option value="system">System</option><option value="light">Light</option><option value="dark">Dark</option></select></div><div class="app-release-info"><p id="app-version" hidden></p><button id="release-notes" class="text-button">What’s new</button></div><button id="app-update" class="text-button">Check for updates</button></div></aside>
<main><header class="window-toolbar"><button id="toggle-sidebar" class="icon-button" aria-label="Hide sidebar" title="Hide sidebar"><span data-icon="sidebar"></span></button><h1 id="heading">Merge PDFs</h1><div class="toolbar-spacer"></div><button id="add" class="secondary"><span data-icon="add"></span><span id="add-label">Add PDFs</span></button><button id="save" class="primary" disabled><span id="save-label">Save PDF</span></button></header>
<div class="content-scroll" id="content-scroll">
<section id="empty" class="empty-state"><div class="empty-art" aria-hidden="true"><span data-icon="document"></span></div><p class="drop-label">Drop PDFs here</p><button id="choose" class="secondary"><span data-icon="add"></span><span id="choose-label">Choose PDFs</span></button></section>
<section id="loaded" hidden><div class="section-heading"><h3 id="list-label">Files</h3><button id="clear" class="text-button">Clear</button></div><ol id="documents" class="document-list" aria-label="Selected documents"></ol>
<section id="compression-options" class="options-section" hidden><div class="compression-toolbar"><fieldset class="compression-choices"><legend class="sr-only">Compression quality</legend><label class="choice"><input type="radio" name="compression" value="lossless"><span>Original quality</span></label><label class="choice"><input type="radio" name="compression" value="balanced" checked><span>Balanced</span></label><label class="choice"><input type="radio" name="compression" value="small"><span>Smaller</span></label></fieldset><label class="target-control" for="target-size">Limit per PDF <input id="target-size" type="number" min="0.1" max="250" step="0.1" placeholder="None" inputmode="decimal"> MB</label></div><div class="compression-result"><p class="compression-size" id="compression-size" role="status" aria-live="polite" hidden></p><button id="compare-output" class="secondary" disabled><span data-icon="compare"></span>Compare</button></div></section>
<section id="split-options" class="options-section" hidden>
<div class="form-row"><label for="split-mode">Split by</label><select id="split-mode"><option value="selected">Selected pages</option><option value="ranges">Named groups</option><option value="groups">Page count</option><option value="every_page">Every page</option><option value="after">Split points</option><option value="bookmarks">Bookmarks</option></select></div>
<div class="form-row" id="group-row" hidden><label for="group-size">Pages per PDF</label><input id="group-size" type="number" min="1" max="10000" value="5" inputmode="numeric"></div>
<div id="selection-row"><label class="sr-only" for="split-ranges">Pages</label><input id="split-ranges" type="text" placeholder="Pages: 1-3, 5, 8" autocomplete="off" spellcheck="false"><label class="split-check"><input id="split-separate" type="checkbox">One PDF per page</label></div>
<div id="range-row" hidden><div id="split-group-list"></div><button id="add-split-group" class="secondary"><span data-icon="add"></span>Add group</button><label class="split-check"><input id="split-combine" type="checkbox">Combine groups</label></div>
<div id="cut-row" hidden><label class="sr-only" for="split-cuts">Split after pages</label><input id="split-cuts" type="text" placeholder="Split after: 3, 7" autocomplete="off" spellcheck="false"></div>
<p id="split-summary" class="context-note" role="status" aria-live="polite"></p><details id="split-output-details"><summary>Outputs</summary><ol id="split-output-list"></ol></details>
</section>
<section id="document-changes" class="document-changes" hidden aria-label="Document changes"><p id="changes-message"></p><label class="split-check" id="flatten-row" hidden><input id="flatten-forms" type="checkbox">Flatten forms</label><label class="split-check" id="acknowledge-row" hidden><input id="acknowledge-changes" type="checkbox">Save a changed copy</label></section>
<section id="organizer" class="options-section" hidden><div class="organizer-toolbar" role="toolbar" aria-label="Page actions"><div class="organizer-tools" id="organizer-tools"><button id="select-all" class="text-button">Select all</button><button id="invert-selection" class="icon-button" aria-label="Invert selection" title="Invert selection" hidden><span data-icon="invert"></span></button><span id="organizer-edits"><button id="rotate-left" class="icon-button" aria-label="Rotate left" title="Rotate left"><span data-icon="rotate"></span></button><button id="rotate" class="icon-button" aria-label="Rotate right" title="Rotate right"><span data-icon="rotate"></span></button><button id="duplicate-pages" class="icon-button" aria-label="Duplicate pages" title="Duplicate"><span data-icon="duplicate"></span></button><button id="delete-pages" class="icon-button" aria-label="Remove pages" title="Remove"><span data-icon="trash"></span></button><span class="toolbar-divider"></span><button id="undo" class="icon-button" aria-label="Undo" title="Undo"><span data-icon="undo"></span></button><button id="redo" class="icon-button" aria-label="Redo" title="Redo"><span data-icon="redo"></span></button><details class="page-more"><summary aria-label="More page actions" title="More"><span data-icon="more"></span></summary><div class="page-more-content"><button id="move-left" class="secondary"><span data-icon="left"></span>Move earlier</button><button id="move-right" class="secondary"><span data-icon="right"></span>Move later</button><div id="move-pages-controls"><label for="move-page-position">Move to</label><input id="move-page-position" type="number" min="1" value="1" inputmode="numeric"><button id="move-pages-to" class="secondary">Move</button></div></div></details></span><span id="organizer-selection" class="context-note"></span></div><label class="thumbnail-control" for="thumbnail-size"><span data-icon="organize"></span><input id="thumbnail-size" type="range" min="100" max="190" step="15" value="130" aria-label="Thumbnail size"></label></div><div class="page-grid" id="page-grid" aria-label="Pages in output order"></div><div class="page-navigation"><span id="page-selection" class="context-note"></span><div><button id="previous-pages" class="icon-button" aria-label="Previous pages"><span data-icon="left"></span></button><span id="page-window"></span><button id="next-pages" class="icon-button" aria-label="Next pages"><span data-icon="right"></span></button><label class="sr-only" for="jump-page">Go to page</label><input id="jump-page" type="number" min="1" placeholder="Page" aria-label="Go to page"></div></div></section>
</section></div>
<footer class="status-bar"><div class="status-content"><span id="busy-indicator" class="spinner" hidden aria-hidden="true"></span><div><p id="status" role="status" aria-live="polite">Checking PDF engine...</p><p id="summary">No PDFs selected</p></div></div><button id="retry-engine" class="text-button" hidden>Try again</button><button id="cancel" class="secondary" hidden>Cancel</button><button id="reveal" class="secondary" hidden><span data-icon="folder"></span>Show in folder</button></footer></main></div>
<dialog id="preview-dialog" aria-labelledby="preview-title"><header><h2 id="preview-title">Preview</h2><button id="close-preview" class="secondary">Done</button></header><div class="preview-toolbar"><div class="preview-paging"><button id="preview-previous" class="icon-button" aria-label="Previous page"><span data-icon="left"></span></button><label for="preview-page" class="sr-only">Page</label><input id="preview-page" type="number" min="1" value="1"><span id="preview-total"></span><button id="preview-next" class="icon-button" aria-label="Next page"><span data-icon="right"></span></button></div><label for="preview-zoom" class="sr-only">Zoom</label><select id="preview-zoom"><option value="1">Fit</option><option value="1.5">150%</option><option value="2">200%</option><option value="3">300%</option></select></div><div id="preview-panes"><section class="preview-pane"><h3 id="original-label" hidden>Original</h3><div id="large-preview" class="preview-canvas"></div></section><section class="preview-pane" id="compressed-pane" hidden><h3>Compressed</h3><div id="compressed-preview" class="preview-canvas"></div></section></div><button id="preview-resize" aria-label="Resize preview" title="Resize preview"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M5 13 13 5M9 13l4-4"/></svg></button></dialog>
<dialog id="password-dialog" aria-labelledby="password-title"><form id="password-form"><h2 id="password-title">Unlock PDF</h2><p id="password-name"></p><label for="pdf-password" class="sr-only">Password</label><input id="pdf-password" type="password" placeholder="Password" autocomplete="off" required><p id="password-error" class="invalid" role="alert" hidden></p><div class="dialog-actions"><button id="password-skip" type="button" class="secondary">Skip</button><button id="password-unlock" type="submit" class="primary">Unlock</button></div></form></dialog>
<script type="module" src="/src/main.js"></script></body></html>
